<!DOCTYPE html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reflectiv · Proforma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#232850;
  --navy-2:#39416f;
  --navy-3:#5b6390;
  --steel:#e4e7ef;
  --steel-2:#f2f4f8;
  --app-bg:#dfe3ec;
  --paper:#ffffff;
  --ink:#1a1c2b;
  --ink-soft:#5d6274;
  --line:#c9cedd;
  --teal:#1c7b84;
  --warn:#a3521f;
  --ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --doc:"Helvetica Neue",Arial,Helvetica,sans-serif;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--ui);
  background:var(--app-bg);
  color:var(--ink);
  font-size:14px;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- top bar ---------- */
.bar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:14px;
  padding:10px 16px;
  background:var(--navy);color:#fff;
  box-shadow:0 1px 0 rgba(0,0,0,.2);
}
.bar img{height:26px;width:auto;filter:brightness(0) invert(1)}
.bar .sp{flex:1}
.bar .who{font-size:12px;letter-spacing:.04em;color:#a9b0d4;white-space:nowrap}
.btn{
  border:1px solid transparent;border-radius:var(--r);
  padding:8px 13px;background:var(--navy-2);color:#fff;
  cursor:pointer;white-space:nowrap;font-weight:500;
}
.btn:hover{background:var(--navy-3)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.btn.ghost{background:transparent;border-color:#6870a0}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn.go{background:var(--teal)}
.btn.go:hover{background:#22929c}
.btn.danger{background:transparent;border-color:#d8b3a3;color:var(--warn)}
.btn.danger:hover{background:#f7ece6}
.btn.sm{padding:5px 9px;font-size:12.5px}
select.lang{
  background:var(--navy-2);border:1px solid #6870a0;border-radius:var(--r);
  padding:8px 9px;color:#fff;cursor:pointer;
}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:minmax(360px,1fr) minmax(0,1.05fr);gap:0;align-items:start}
.editor{padding:18px 20px 120px;max-height:calc(100vh - 46px);overflow-y:auto}
.viewer{
  padding:18px 20px 60px;background:#cfd5e3;
  min-height:calc(100vh - 46px);
  max-height:calc(100vh - 46px);overflow-y:auto;
  border-left:1px solid #b9c0d2;
}
.tabs{display:none}

/* ---------- editor cards ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
.card>h2{
  margin:0;font-size:13px;font-weight:600;letter-spacing:.02em;
  padding:10px 14px;background:var(--steel-2);border-bottom:1px solid var(--line);
  border-radius:var(--r) var(--r) 0 0;color:var(--navy);
  display:flex;align-items:center;gap:8px;
}
.card>h2 .n{
  width:19px;height:19px;border-radius:50%;background:var(--navy);color:#fff;
  font-size:11px;display:grid;place-items:center;font-weight:600;
}
.card .body{padding:14px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:3px}
input[type=text],input[type=date],input[type=number],textarea,select.f{
  width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:4px;background:#fff;
}
input:focus,textarea:focus,select:focus{outline:2px solid var(--teal);outline-offset:-1px;border-color:var(--teal)}
textarea{min-height:60px;resize:vertical}

/* line item rows */
.rows{display:flex;flex-direction:column;gap:7px}
.row{display:grid;gap:6px;align-items:center}
.row.films{grid-template-columns:1fr 74px 74px 62px 30px}
.row.qty{grid-template-columns:1fr 62px 88px 82px 30px}
.rowhead{font-size:10.5px;color:var(--ink-soft);padding:0 2px}
.rowhead span{display:block}
.calc{text-align:right;font-variant-numeric:tabular-nums;color:var(--navy);font-weight:500;font-size:13px;padding-right:2px}
.del{
  border:1px solid var(--line);background:#fff;border-radius:4px;height:32px;
  cursor:pointer;color:#98607f;line-height:1;
}
.del:hover{background:#fbeef3;border-color:#e0bccd}
.add{margin-top:10px;border:1px dashed var(--navy-3);background:#fff;color:var(--navy);
  border-radius:var(--r);padding:8px 12px;cursor:pointer;width:100%;font-weight:500}
.add:hover{background:var(--steel-2)}
.sumline{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:12px;padding-top:10px;border-top:1px solid var(--line);
  font-variant-numeric:tabular-nums;
}
.sumline b{font-size:16px;color:var(--navy)}

/* ---------- sheet (document) ---------- */
.sheetbox{transform-origin:top left}
.sheet{
  width:186mm;background:var(--paper);padding:0 0 8mm;
  font-family:var(--doc);color:#111;box-shadow:0 6px 24px rgba(20,26,55,.22);
}
.sheet .pad{padding:7mm 8mm}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12mm}
.sh-top img{height:12mm;width:auto}
.sh-meta{text-align:right;font-size:9pt;line-height:1.55}
.sh-meta .kind{
  font-family:var(--ui);font-size:15pt;font-weight:700;letter-spacing:.06em;
  color:var(--navy);margin:0 0 2mm;
}
.sh-meta dt{display:inline;color:#6b7085}
.sh-meta div{white-space:nowrap}
.sh-rule{height:2mm;background:var(--navy);margin:4mm 0 0}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:8mm;font-size:8.6pt;line-height:1.45;margin-top:4mm}
.parties h4{
  font-family:var(--ui);margin:0 0 1.5mm;font-size:8pt;font-weight:600;
  color:var(--navy);border-bottom:.4mm solid var(--steel);padding-bottom:1mm;
}
.parties .l{color:#6b7085}
table.doc{width:100%;border-collapse:collapse;font-size:8.2pt;margin-top:4mm}
table.doc caption{
  caption-side:top;text-align:left;font-family:var(--ui);font-weight:600;font-size:8.2pt;
  color:#fff;background:var(--navy);padding:1.2mm 2mm;letter-spacing:.02em;
}
table.doc th{
  background:var(--steel-2);color:var(--navy);font-weight:600;text-align:right;
  padding:1.2mm 2mm;border-bottom:.3mm solid var(--line);font-size:7.6pt;
}
table.doc th:first-child,table.doc td:first-child{text-align:left}
table.doc td{padding:1.05mm 2mm;text-align:right;border-bottom:.2mm solid #e9ebf2;font-variant-numeric:tabular-nums}
table.doc tbody tr:nth-child(even) td{background:#fafbfd}
table.doc td.idx{color:#9aa0b4;width:6mm;text-align:right;padding-right:1mm}
table.doc tfoot td{
  font-weight:600;color:var(--navy);border-bottom:none;border-top:.3mm solid var(--line);
  background:#fff;
}
.totals{margin-top:5mm;display:flex;justify-content:flex-end}
.totals table{border-collapse:collapse;font-size:9pt;min-width:78mm}
.totals td{padding:1.3mm 3mm;text-align:right;font-variant-numeric:tabular-nums}
.totals td:first-child{text-align:left;color:#4a4f63}
.totals .basis{display:block;font-size:7.4pt;color:#8b90a4;margin-top:.4mm}
.totals tr.grand td{
  background:var(--navy);color:#fff;font-weight:700;font-size:10.5pt;padding:2mm 3mm;
}
.docnotes{margin-top:5mm;font-size:8.4pt;line-height:1.5;color:#3d4256;white-space:pre-wrap;
  border-left:.8mm solid var(--steel);padding-left:3mm}
.sh-foot{
  margin-top:5mm;padding-top:2mm;border-top:.3mm solid var(--line);
  font-size:7.2pt;color:#8b90a4;text-align:center;font-style:italic;
}
.muted-empty{font-size:8.6pt;color:#a0a5b8;padding:2mm 2.5mm;font-style:italic}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(24,28,50,.55);display:none;z-index:60;padding:20px}
.modal.on{display:grid;place-items:center}
.panel{background:#fff;border-radius:8px;width:min(560px,100%);max-height:80vh;display:flex;flex-direction:column}
.panel header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.panel header h3{margin:0;font-size:15px;color:var(--navy)}
.panel .list{overflow-y:auto;padding:8px}
.draft{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--steel-2)}
.draft .t{flex:1;min-width:0}
.draft .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.draft .t span{font-size:11.5px;color:var(--ink-soft)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-soft)}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:var(--navy);color:#fff;padding:10px 18px;border-radius:20px;
  z-index:80;opacity:0;pointer-events:none;transition:opacity .18s;font-size:13px;
}
.toast.on{opacity:1}

@media (max-width:940px){
  .wrap{grid-template-columns:1fr}
  .editor,.viewer{max-height:none;min-height:0;overflow:visible;border-left:none}
  .viewer{padding-top:12px}
  .tabs{display:flex;gap:6px;padding:8px 12px;background:#cfd5e3;position:sticky;top:46px;z-index:30;border-bottom:1px solid #b9c0d2}
  .tabs button{flex:1;padding:8px;border:1px solid var(--line);background:#fff;border-radius:var(--r);cursor:pointer}
  .tabs button[aria-selected=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
  body.show-preview .editor{display:none}
  body:not(.show-preview) .viewer{display:none}
  .bar .who{display:none}
  .row.films{grid-template-columns:1fr 1fr 1fr 62px 30px}
  .row.films .desc{grid-column:1/-1}
  .row.qty{grid-template-columns:1fr 1fr 82px 30px}
  .row.qty .desc{grid-column:1/-1}
  .rowhead{display:none}
}

@media print{
  @page{size:A4 portrait;margin:10mm}
  *,*::before,*::after{
    -webkit-print-color-adjust:exact!important;
    print-color-adjust:exact!important;
    color-adjust:exact!important;
  }
  body{background:#fff}
  table.doc caption{background:var(--navy)!important;color:#fff!important}
  table.doc th{background:var(--steel-2)!important}
  .sh-rule{background:var(--navy)!important}
  .totals tr.grand td{background:var(--navy)!important;color:#fff!important}
  .bar,.tabs,.editor,.modal,.toast{display:none!important}
  .wrap{display:block}
  .viewer{padding:0;background:#fff;border:none;max-height:none;overflow:visible;display:block!important}
  .sheetbox{transform:none!important;height:auto!important}
  .sheet{
    width:calc(186mm / var(--pk,1));
    transform:scale(var(--pk,1));
    transform-origin:top left;
    box-shadow:none;padding:0;
  }
  .sheet .pad{padding:0}
  table.doc{page-break-inside:auto}
  table.doc tr{page-break-inside:avoid}
  .totals{page-break-inside:avoid}
}
</style>

let lang = "es";
let S = blank();
let currentDraftId = null;

function blank(){
  return {
    number:"", date:new Date().toISOString().slice(0,10), valid:"30", project:"",
    client:{company:"",contact:""},
    unit:"cm", ppm:"140", filmDisc:"0", elecDisc:"0", logDisc:"0",
    films:[{d:"",l:"",h:""}],
    elec:[

const num = v => { const n = parseFloat(String(v==null?"":v).replace(",",".")); return isFinite(n)?n:0; };
const money = n => new Intl.NumberFormat(T[lang].loc,{style:"currency",currency:"EUR"}).format(n||0);
const m2fmt3 = n => new Intl.NumberFormat(T[lang].loc,{minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const dimfmt = n => new Intl.NumberFormat(T[lang].loc,{minimumFractionDigits:0,maximumFractionDigits:S.unit==="cm"?1:3}).format(n||0);
const m2fmt = n => new Intl.NumberFormat(T[lang].loc,{minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const itemName = r => (String(r.d||"").trim()) || (r.key && T[lang].items[r.key]) || "";
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============ maths ============ */
function calc(){
  const f = S.unit==="cm" ? 0.01 : 1;
  const films = S.films.map(r=>({...r, m2: num(r.l)*f*num(r.h)*f}));
  const totalM2 = films.reduce((a,r)=>a+r.m2,0);
  const filmsGross = totalM2*num(S.ppm);
  const filmsNet = filmsGross*(1-num(S.filmDisc)/100);
  const elec = S.elec.map(r=>({...r, amt: num(r.q)*num(r.u)}));
  const elecGross = elec.reduce((a,r)=>a+r.amt,0);
  const elecNet = elecGross*(1-num(S.elecDisc)/100);
  const log = S.log.map(r=>({...r, amt: num(r.q)*num(r.u)}));
  const logGross = log.reduce((a,r)=>a+r.amt,0);
  const logNet = logGross*(1-num(S.logDisc)/100);
  return {films,totalM2,filmsGross,filmsNet,elec,elecGross,elecNet,log,logGross,logNet,
          grand: filmsNet+elecNet+logNet};
}

/* ============ document rendering ============ */
function sheetHTML(){
  const t = T[lang], c = calc();
  const dateStr = S.date ? new Intl.DateTimeFormat(T[lang].loc,{day:"2-digit",month:"long",year:"numeric"}).format(new Date(S.date+"T12:00:00")) : "—";
  const cl = S.client;
  const clientBlock = [cl.company,cl.contact]
      .filter(Boolean).map(esc).join("<br>") || `<span class="l">—</span>`;

  const filmRows = c.films.filter(r=>r.d||r.m2).map((r,i)=>`
    <tr><td class="idx">${i+1}</td><td>${esc(r.d)||"—"}</td><td>${r.l?dimfmt(num(r.l)):"—"}</td>
    <td>${r.h?dimfmt(num(r.h)):"—"}</td><td>${m2fmt3(r.m2)}</td></tr>`).join("");

  const lineTable = (key,caption,rows,gross,disc,net) => {
    const body = rows.filter(r=>itemName(r)||r.amt).map(r=>`
      <tr><td>${esc(itemName(r))||"—"}</td><td>${m2fmt(num(r.q))}</td><td>${money(num(r.u))}</td><td>${money(r.amt)}</td></tr>`).join("");
    if(!body) return "";
    return `<table class="doc"><caption>${esc(caption)}</caption>
      <thead><tr><th>${esc(t.desc)}</th><th style="width:14mm">${esc(t.qty)}</th><th style="width:24mm">${esc(t.unit)}</th><th style="width:26mm">${esc(t.amount)}</th></tr></thead>
      <tbody>${body}</tbody>
      <tfoot><tr><td colspan="3">${esc(caption)}${num(disc)?` · ${esc(t.disc)} ${m2fmt(num(disc))}%`:""}</td><td>${money(net)}</td></tr></tfoot>
    </table>`;
  };

  const filmsTable = filmRows ? `<table class="doc"><caption>${esc(t.films)}</caption>
      <thead><tr><th></th><th>${esc(t.desc)}</th><th style="width:20mm">${esc(t.len)} (${S.unit})</th><th style="width:20mm">${esc(t.hei)} (${S.unit})</th><th style="width:20mm">${esc(t.m2)}</th></tr></thead>
      <tbody>${filmRows}</tbody>
      <tfoot>
        <tr><td colspan="4">${esc(t.totalM2)}</td><td>${m2fmt3(c.totalM2)}</td></tr>
        <tr><td colspan="4">${m2fmt3(c.totalM2)} m² × ${money(num(S.ppm))}${num(S.filmDisc)?` − ${m2fmt(num(S.filmDisc))}%`:""}</td><td>${money(c.filmsNet)}</td></tr>
      </tfoot>
    </table>` : "";

  const totalRow = (label,val,sub)=>`<tr><td>${esc(label)}${sub?`<span class="basis">${sub}</span>`:""}</td><td>${money(val)}</td></tr>`;
  const dnote = d => num(d) ? ` − ${m2fmt(num(d))}%` : "";

  return `
  <div class="sh-top">
    <img src="${LOGO}" alt="Reflectiv">
    <div class="sh-meta">
      <p class="kind">${esc(t.kind)}</p>
      <div><span class="dt">${esc(t.num)}: </span>${esc(S.number)||"—"}</div>
      <div><span class="dt">${esc(t.date)}: </span>${dateStr}</div>
      ${S.valid?`<div><span class="dt">${esc(t.valid)}: </span>${esc(S.valid)} ${lang==="en"?"days":lang==="fr"?"jours":lang==="it"?"giorni":"días"}</div>`:""}
    </div>
  </div>
  <div class="sh-rule"></div>
  <div class="parties">
    <div><h4>${esc(t.issuedBy)}</h4>${ISSUER.map(esc).join("<br>")}</div>
    <div><h4>${esc(t.billTo)}</h4>${clientBlock}</div>
  </div>
  ${S.project?`<div class="parties" style="grid-template-columns:1fr;margin-top:5mm"><div><h4>${esc(t.project)}</h4>${esc(S.project)}</div></div>`:""}
  ${filmsTable}
  ${lineTable("elec",t.elec,c.elec,c.elecGross,S.elecDisc,c.elecNet)}
  ${lineTable("log",t.log,c.log,c.logGross,S.logDisc,c.logNet)}
  <div class="totals"><table>
    ${c.filmsGross?totalRow(t.totalFilms,c.filmsNet):""}
    ${c.elecGross?totalRow(t.totalElec,c.elecNet,num(S.elecDisc)?`${money(c.elecGross)}${dnote(S.elecDisc)}`:""):""}
    ${c.logGross?totalRow(t.totalLog,c.logNet,num(S.logDisc)?`${money(c.logGross)}${dnote(S.logDisc)}`:""):""}
    <tr class="grand"><td>${esc(t.grand)}</td><td>${money(c.grand)}</td></tr>
  </table></div>
  ${S.notes?`<div class="docnotes">${esc(S.notes)}</div>`:""}
  <div class="sh-foot">${esc(t.tagline)}</div>`;
}

function fitSheet(){
  const box = $("sheetbox"), v = $("viewer"), sheet = $("sheet");
  box.style.transform = "none"; box.style.height = "auto";
  const avail = v.clientWidth - 40;
  const w = sheet.offsetWidth;
  const s = Math.min(1, avail / w);
  box.style.transform = `scale(${s})`;
  box.style.height = (sheet.offsetHeight * s) + "px";
}

function render(){
  const t = T[lang], c = calc();
  $("sheetpad").innerHTML = sheetHTML();
  $("v-films").textContent = money(c.filmsNet);
  $("v-elec").textContent = money(c.elecNet);
  $("v-log").textContent = money(c.logNet);
  $("s-m2").textContent = `${t.totalM2}: ${m2fmt3(c.totalM2)} × ${money(num(S.ppm))}`;
  $("barref").textContent = [S.number,S.client.company].filter(Boolean).join(" · ") || t.untitled;
  document.documentElement.lang = lang;
  fitSheet();
}
function renderAll(){ labels(); rowsUI(); render(); }

  const el = e.target;

    S[el.dataset.k][+el.dataset.i][el.dataset.f] = el.value;

function setTab(prev){
  document.body.classList.toggle("show-preview",prev);
  $("tabEdit").setAttribute("aria-selected",String(!prev));
  $("tabPrev").setAttribute("aria-selected",String(prev));
  if(prev) requestAnimationFrame(fitSheet);

window.addEventListener("resize", fitSheet);

/* shrink the sheet just enough to land on a single A4 page */
function fitOnePage(){
  const box = $("sheetbox"), sheet = $("sheet");
  const prev = box.style.transform;
  box.style.transform = "none";
  const px = 96/25.4;                       // CSS px per mm
  const avail = (297 - 20) * px;            // A4 height minus print margins
  const h = sheet.offsetHeight;
  box.style.transform = prev;
  const k = h > avail ? Math.max(0.55, avail / h) : 1;
  document.documentElement.style.setProperty("--pk", k.toFixed(4));
}
window.addEventListener("beforeprint", fitOnePage);
window.addEventListener("afterprint", ()=>document.documentElement.style.setProperty("--pk","1"));

let toastT;
function toast(msg){ const el=$("toast"); el.textContent=msg; el.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),1900); }

/* ============ drafts ============ */
const KEY = "reflectiv-proformas";
/* Works inside Claude (window.storage) and as a plain hosted page (localStorage). */
const mem = new Map();
let persists = true;                       // false => only this tab, until reload
function ls(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return localStorage; }catch(e){ return null; } }
const store = {
  async get(k){
    if(window.storage) return await window.storage.get(k);
    const L = ls();
    if(L){ const v = L.getItem(k); if(v===null) throw new Error("not found"); return {key:k,value:v}; }
    if(mem.has(k)) return {key:k,value:mem.get(k)};
    throw new Error("not found");
  },
  async set(k,v){
    if(window.storage) return await window.storage.set(k,v);
    const L = ls();
    if(L){ L.setItem(k,v); return {key:k,value:v}; }
    persists = false; mem.set(k,v); return {key:k,value:v};
  }
};
let cfg = {url:DRIVE.url, token:DRIVE.token};
const remote = () => !!cfg.url;

async function loadCfg(){
  try{ cfg = Object.assign(cfg, JSON.parse((await store.get("reflectiv-cfg")).value)); }catch(err){}
  $("f-durl").value = cfg.url; $("f-dtok").value = cfg.token;
  if(remote()) $("cfgstate").textContent = "\u25cf";
}
async function api(payload){
  const r = await fetch(cfg.url,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(Object.assign({token:cfg.token},payload))
  });
  return await r.json();
}
async function loadLocal(){
  try{ const r = await store.get(KEY); return r ? JSON.parse(r.value) : []; }catch(err){ return []; }
}
async function saveLocal(list){
  try{ await store.set(KEY, JSON.stringify(list)); return true; }catch(err){ return false; }
}
async function loadDrafts(){
  if(remote()){
    try{
      const r = await fetch(cfg.url+"?token="+encodeURIComponent(cfg.token));
      const j = await r.json();
      if(j.ok) return j.drafts;
    }catch(err){}
    toast(T[lang].dFail);
    return [];
  }
  return await loadLocal();
}
async function putDraft(rec){
  if(remote()){
    try{ const j = await api({action:"save",draft:rec}); return !!j.ok; }catch(err){ return false; }
  }
  const list = await loadLocal();
  const i = list.findIndex(x=>x.id===rec.id);
  if(i>=0) list[i]=rec; else list.unshift(rec);
  return await saveLocal(list);
}
async function delDraft(id){
  if(remote()){
    try{ const j = await api({action:"delete",id}); return !!j.ok; }catch(err){ return false; }
  }
  return await saveLocal((await loadLocal()).filter(x=>x.id!==id));
}
async function saveDrafts(list){
  if(remote()){
    let ok = true;
    for(const d of list){ if(!(await putDraft(d))) ok = false; }
    return ok;
  }
  return await saveLocal(list);
}
$("btnSave").onclick = async ()=>{
  const rec = { id: currentDraftId || ("p"+Date.now()), updated: Date.now(), lang,
                label: [S.number,S.client.company||S.project].filter(Boolean).join(" \u00b7 ") || T[lang].untitled,
                data: JSON.parse(JSON.stringify(S)) };
  currentDraftId = rec.id;
  const ok = await putDraft(rec);
  if(remote()){ toast(ok ? T[lang].dSaved : T[lang].dFail); return; }
  toast(ok ? (persists ? T[lang].saved : T[lang].savedTemp) : T[lang].saveFail);
  if(!persists) $("warn").style.display = "block";
};
$("btnDrafts").onclick = async ()=>{ await drawDrafts(); $("modal").classList.add("on"); };
$("m-close").onclick = ()=>$("modal").classList.remove("on");
$("modal").addEventListener("click", e=>{ if(e.target.id==="modal") $("modal").classList.remove("on"); });

$("m-drive").onclick = ()=>{
  const b = $("cfgbox");
  b.style.display = b.style.display==="none" ? "block" : "none";
};
$("m-cfgsave").onclick = async ()=>{
  cfg.url = $("f-durl").value.trim();
  cfg.token = $("f-dtok").value.trim();
  $("cfgstate").textContent = "\u2026";
  if(!cfg.url){
    try{ await store.set("reflectiv-cfg", JSON.stringify(cfg)); }catch(e){}
    $("cfgstate").textContent = ""; await drawDrafts(); return;
  }
  try{
    const r = await fetch(cfg.url+"?token="+encodeURIComponent(cfg.token));
    const j = await r.json();
    if(!j.ok) throw new Error(j.error||"?");
    try{ await store.set("reflectiv-cfg", JSON.stringify(cfg)); }catch(e){}
    $("cfgstate").textContent = T[lang].dOk;
    await drawDrafts();
  }catch(err){
    $("cfgstate").textContent = T[lang].dFail;
  }
};

$("m-export").onclick = async ()=>{
  const list = await loadDrafts();
  const blob = new Blob([JSON.stringify({app:"reflectiv-proforma",v:1,drafts:list},null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `reflectiv-proformas-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
};
$("m-import").onclick = ()=>$("m-file").click();
$("m-file").onchange = async e=>{
  const file = e.target.files[0]; if(!file) return;
  try{
    const inc = JSON.parse(await file.text()).drafts || [];
    const list = await loadDrafts();
    const byId = new Map(list.map(d=>[d.id,d]));
    inc.forEach(d=>{ const cur = byId.get(d.id); if(!cur || (d.updated||0) > (cur.updated||0)) byId.set(d.id,d); });
    await saveDrafts([...byId.values()]);
    await drawDrafts(); toast(T[lang].imported);
  }catch(err){ toast("JSON ✕"); }
  e.target.value = "";
};

async function drawDrafts(){
  const t = T[lang], list = await loadDrafts();
  const box = $("m-list");
  if(!list.length){ box.innerHTML = `<div class="empty">${esc(t.noDrafts)}</div>`; return; }
  list.sort((a,b)=>b.updated-a.updated);
  box.innerHTML = list.map(d=>`
    <div class="draft">
      <div class="t"><b>${esc(d.label)}</b><span>${new Date(d.updated).toLocaleString(T[lang].loc)}</span></div>
      <button class="btn sm" data-act="open" data-id="${d.id}">${esc(t.open)}</button>
      <button class="btn ghost sm" style="border-color:var(--line);color:var(--ink)" data-act="dup" data-id="${d.id}">${esc(t.dup)}</button>
      <button class="btn danger sm" data-act="del" data-id="${d.id}">${esc(t.del)}</button>
    </div>`).join("");
  box.querySelectorAll("[data-act]").forEach(b=>b.onclick = ()=>draftAction(b.dataset.act,b.dataset.id));
}
async function draftAction(act,id){
  const t = T[lang];
  let list = await loadDrafts();
  const d = list.find(x=>x.id===id); if(!d) return;
  if(act==="open" || act==="dup"){
    S = JSON.parse(JSON.stringify(d.data));
    currentDraftId = act==="open" ? d.id : null;
    fillFields(); renderAll(); $("modal").classList.remove("on"); toast(t.loaded);
    if(act==="dup") assignNumber();
  } else if(act==="del"){
    if(!confirm(t.confirmDel)) return;
    if(currentDraftId===id) currentDraftId=null;
    await delDraft(id); await drawDrafts(); toast(t.deleted);
  }
}

/* ============ automatic number ============ */
async function nextNumber(){
  const d = new Date(), y = String(d.getFullYear()).slice(2), m = String(d.getMonth()+1).padStart(2,"0");
  let n = null;
  try{
    const r = await store.get("reflectiv-counter");
    n = (JSON.parse(r.value).n || 0) + 1;
  }catch(err){ n = null; }
  if(n===null) n = 1;
  try{ await store.set("reflectiv-counter", JSON.stringify({n})); }
  catch(err){ return `PF-${y}${m}-${Date.now().toString(36).slice(-5).toUpperCase()}`; }
  return `PF-${y}${m}-${String(n).padStart(4,"0")}`;
}
async function assignNumber(){
  S.number = await nextNumber();
  $("f-number").value = S.number;
  render();
}

/* ============ boot ============ */
fillFields(); renderAll(); assignNumber();

</script>
